name: PhotoSorter
options:
  bundleIdPrefix: de.photosorter
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoSorter:
    type: application
    platform: macOS
    sources: [PhotoSorter]
    scheme:
      testTargets: [PhotoSorterTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.photosorter.PhotoSorter
        PRODUCT_NAME: Photo Terminator
        PRODUCT_MODULE_NAME: PhotoSorter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Terminator
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PhotoSorter/PhotoSorter.entitlements
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo Terminator analysiert deine Fotos auf dem Gerät und schlägt vor, welche du löschen kannst. Favoriten werden immer behalten."
  PhotoSorterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PhotoSorterTests]
    dependencies:
      - target: PhotoSorter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.photosorter.PhotoSorterTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Photo Terminator.app/Contents/MacOS/Photo Terminator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
