name: PhotoSorter
options:
  bundleIdPrefix: de.photosorter
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PhotoSorter:
    type: application
    platform: macOS
    sources: [PhotoSorter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.photosorter.PhotoSorter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhotoSorter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
